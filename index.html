<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda TI - Caja Honor</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <header>
        <div>Usuario: <span id="usuarioActivo"></span></div>
        <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
    </header>

    <div id="login" class="login-container">
        <div class="login-left">
            <h1>🏢 Caja Honor TI</h1>
            <p>Sistema Automatizado de Mesa de Ayuda</p>
        </div>
        <div class="login-right">
            <div class="login-box">
                <h2>Iniciar Sesión</h2>
                <input id="user" placeholder="Usuario">
                <input id="pass" type="password" placeholder="Contraseña">
                <div class="error" id="errorMsg"></div>
                <button onclick="login()">Ingresar</button>
            </div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <div class="container">
            <div class="sidebar">
                <button onclick="mostrar('dashboard')">Dashboard</button>
                <button onclick="mostrar('crear')" id="btnNavCrear">Crear Ticket</button>
            </div>

            <div class="main">
                <div id="dashboard">
                    <div class="card">Abiertos: <span id="abiertos" class="count-abierto">0</span></div>
                    <div class="card">En Proceso: <span id="proceso" class="count-proceso">0</span></div>
                    <div class="card">Resueltos: <span id="resueltos" class="count-resuelto">0</span></div>

                    <p class="instruccion-orden">💡 Haz clic en los encabezados para ordenar la tabla.</p>
                    <div class="table-responsive">
                        <table id="tabla">
                            <thead>
                                <tr>
                                    <th data-column="id" class="sortable">ID <span class="sort-icon">⇅</span></th>
                                    <th data-column="asunto" class="sortable">Asunto <span class="sort-icon">⇅</span></th>
                                    <th data-column="categoria" class="sortable">Categoría <span class="sort-icon">⇅</span></th>
                                    <th data-column="prioridad" class="sortable">Prioridad <span class="sort-icon">⇅</span></th>
                                    <th data-column="tecnico" class="sortable">Técnico Asignado <span class="sort-icon">⇅</span></th>
                                    <th data-column="estado" class="sortable">Estado <span class="sort-icon">⇅</span></th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsBody">
                                </tbody>
                        </table>
                    </div>
                </div>

                <div id="crear" style="display:none;" class="form-section">
                    <h3 id="formTitulo">Nuevo Ticket</h3>
                    <div class="form-group">
                        <input id="asunto" placeholder="Asunto del Ticket (Ej. Falla en portal)">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <select id="categoria">
                                <option value="">-- Seleccione Categoría --</option>
                                <option value="hardware">Hardware / Equipos</option>
                                <option value="software">Software / Aplicaciones</option>
                                <option value="redes">Redes / Conectividad</option>
                                <option value="documental">Gestión Documental / Archivos</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="prioridad">
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                                <option value="critica">Crítica</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <textarea id="descripcion" rows="3" placeholder="Descripción detallada del problema..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button id="btnSubmit" onclick="guardarTicket()" class="btn-submit">Crear y Asignar</button>
                        <button id="btnCancelar" onclick="limpiarFormulario()" class="btn-cancelar" style="display:none;">Cancelar Edición</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
